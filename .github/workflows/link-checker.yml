name: Check Links

on:
  pull_request:
    branches: [ main ]
  workflow_dispatch:
  schedule:
    # Run weekly on Sundays at 2 AM
    - cron: '0 2 * * 0'

jobs:
  link-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Install dependencies
        run: npm ci

      - name: Build site
        run: npm run build
        env:
          LAMBDA_URL: ${{ secrets.LAMBDA_URL }}

      # --remap checks links to hudsonrobotics4295.com against the fresh build
      # instead of the live site, so a pull request can add a file and link to
      # it in the same change.
      - name: Check internal links
        uses: lycheeverse/lychee-action@v2
        with:
          args: >-
            --verbose --no-progress './_site/**/*.html'
            --root-dir '${{ github.workspace }}/_site'
            --remap 'https://hudsonrobotics4295\.com/(.*) file://${{ github.workspace }}/_site/$1'
            --exclude 'instagram\.com' --exclude 'twitter\.com' --exclude 'x\.com'
            --exclude '404\.html' --exclude 'lambda-url.*\.on\.aws'
          fail: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Lychee skips URLs inside <meta> tags and JSON-LD (share images, logos).
      - name: Check share image and structured-data URLs
        if: success() || failure()
        run: node scripts/check-site-urls.mjs lychee/out.md

      - name: Create Issue on failure
        if: failure()
        uses: peter-evans/create-issue-from-file@v6
        with:
          title: Broken Links Detected
          content-filepath: ./lychee/out.md
          labels: bug, automated
